# F-Droid build metadata for Subster.
#
# This file is a maintained DRAFT: the authoritative copy lives in the
# fdroiddata repo (gitlab.com/fdroid/fdroiddata → metadata/app.subster.yml).
# See SUBMISSION.md next to this file for the submission steps.
#
# Note: commit must be the full commit hash of the release tag, not the tag
# itself (review requirement). Comments are stripped in the fdroiddata copy
# ('fdroid rewritemeta' canonicalizes: sorted categories, no comments).
#
# The Builds entry below is the one submitted with v0.1.6 and is NOT bumped per
# release: AutoUpdateMode/UpdateCheckMode mean F-Droid's checkupdates adds an
# entry for each new vX.Y.Z tag by itself. This copy only needs editing when
# the recipe itself changes — see SUBMISSION.md.
#
# AntiFeatures were requested by the F-Droid reviewer because the metadata
# lookups are on by default. NonFreeNet covers Deezer only (the sole
# proprietary service); TetheredNet covers all three hardcoded endpoints. The
# user's own Subsonic server is NOT tethered — its URL is user-configured.
AntiFeatures:
  NonFreeNet:
    en-US: Ranks song popularity via the proprietary Deezer API, on by default
    de-DE: Bekanntheit über die proprietäre Deezer-API, standardmäßig aktiv
  TetheredNet:
    en-US: deezer.com, musicbrainz.org and wikidata.org are not configurable
    de-DE: deezer.com, musicbrainz.org und wikidata.org nicht konfigurierbar
Categories:
  - Online Media Player
  - Party Game
License: MIT
AuthorName: Rouven Volkmann
WebSite: https://github.com/pLum0/subster
SourceCode: https://github.com/pLum0/subster
IssueTracker: https://github.com/pLum0/subster/issues
Changelog: https://github.com/pLum0/subster/releases

AutoName: Subster

RepoType: git
Repo: https://github.com/pLum0/subster.git

Builds:
  - versionName: 0.1.6
    versionCode: 106
    commit: 1196b95c40f823d6122600e2a00e5fa13c071bd0 # = v0.1.6
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm ci
      - npm run build
      - npx cap sync android
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.1.6
CurrentVersionCode: 106
